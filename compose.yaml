# Postgres for the API, and a Forgejo to point a connection at, for trying repoplane by hand.
# The e2e suite starts its own of both through testcontainers.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: repoplane
      POSTGRES_PASSWORD: repoplane-not-a-secret
      POSTGRES_DB: repoplane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "repoplane"]
      interval: 1s
      retries: 30

  forgejo:
    # Forgejo 15.0.8 (LTS), the digest forgelab pins.
    image: codeberg.org/forgejo/forgejo@sha256:0a2e377fd3c5af3451bfa1f44e6f198f322b6d5e03f04a028b8e672f1ccddc9f
    ports:
      - "3000:3000"
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__SQLITE_JOURNAL_MODE: WAL
      FORGEJO__database__SQLITE_TIMEOUT: "20000"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: repoplane-local-not-a-secret
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__indexer__REPO_INDEXER_ENABLED: "false"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__cron__ENABLED: "false"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__log__LEVEL: warn
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/healthz"]
      interval: 1s
      retries: 60
