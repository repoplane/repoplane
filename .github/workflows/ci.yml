name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *" # nightly: the three cloud sandboxes
  workflow_dispatch: # cloud sandboxes on demand: the Actions tab, or `gh workflow run CI -f sandbox=gh`
    inputs:
      sandbox:
        description: Which cloud sandbox to run
        type: choice
        options: [all, gh, gl, ado]
        default: all

permissions:
  contents: read

jobs:
  # Lint, unit tests, and the e2e suite on a Forgejo of its own: no secrets needed. This is what
  # a pull request and a push to main run; a newer push to a pull request replaces its older run.
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: local-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # Leave no token in git config: every git call in the suite brings its own credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: repoplane/fleets
          path: fleets
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make ci
        env:
          REPOPLANE_FLEETS_DIR: ${{ github.workspace }}/fleets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-local
          path: target/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

  # The same suite on the real sandboxes: nightly, or on demand. They take 15 to 30 minutes
  # (gitlab.com Free's rate limit alone is most of gl's), so no pull request or push waits for
  # them. It mutates them and puts them back with forgelab, so a sandbox is shared state: one
  # run at a time per sandbox, across every branch.
  sandbox:
    needs: local
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Every sandbox, or the one a manual run asks for.
        sandbox: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.sandbox != 'all' && format('["{0}"]', inputs.sandbox) || '["gh","gl","ado"]') }}
    concurrency:
      group: sandbox-${{ matrix.sandbox }}
      cancel-in-progress: false
    steps:
      # Leave no token in git config: every git call in the suite brings its own credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: repoplane/fleets
          path: fleets
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - run: make e2e SANDBOX=${{ matrix.sandbox }}
        env:
          REPOPLANE_FLEETS_DIR: ${{ github.workspace }}/fleets
          FORGELAB_GH_TOKEN: ${{ secrets.FORGELAB_GH_TOKEN }}
          FORGELAB_GL_TOKEN: ${{ secrets.FORGELAB_GL_TOKEN }}
          FORGELAB_ADO_TOKEN: ${{ secrets.FORGELAB_ADO_TOKEN }}
      # The API's and the worker's logs, to read what a slow or failed run was doing.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-${{ matrix.sandbox }}
          path: target/e2e-logs
          if-no-files-found: ignore
          retention-days: 7
