[package]
name = "repoplane-e2e"
description = "End-to-end tests on the fleets sandboxes: the real API, worker and CLI against real forges, put back with forgelab after every scenario."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "lib.rs"

[[test]]
name = "e2e"
path = "e2e.rs"

# Test-only: nothing here is linked into a shipped binary. forgelab is pinned by tag, like CI
# pins its release.
[dependencies]
repoplane-proto.workspace = true
repoplane-forge.workspace = true
repoplane-flow.workspace = true
temporalio-client.workspace = true
temporalio-common.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
base64.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
forgelab = { git = "https://github.com/repoplane/forgelab", tag = "v0.14.0" }
secrecy = "0.10"
tempfile = "3"
testcontainers = { version = "0.28", features = ["http_wait"] }
