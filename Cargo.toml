[workspace]
resolver = "3"
members = [
  "crates/repoplane-proto",
  "crates/repoplane-forge",
  "crates/repoplane-store",
  "crates/repoplane-api",
  "crates/repoplane-worker",
  "crates/repoplane-cli",
  "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/repoplane/repoplane"
rust-version = "1.93"

[workspace.dependencies]
repoplane-proto = { path = "crates/repoplane-proto" }
repoplane-forge = { path = "crates/repoplane-forge" }
repoplane-store = { path = "crates/repoplane-store" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
http = "1"
rand = "0.9"
reqwest = { version = "0.13", features = ["json", "gzip", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
